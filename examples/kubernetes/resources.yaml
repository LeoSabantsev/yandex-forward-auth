apiVersion: apps/v1
kind: Deployment
metadata:
  name: yandex-forward-auth
spec:
  replicas: 1
  selector:
    matchLabels: {app: yandex-forward-auth}
  template:
    metadata:
      labels: {app: yandex-forward-auth}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: auth
          image: docker.io/levsab/yandex-forward-auth@sha256:235ec57cbb8bf40e38b9cbb1c14bdfe83db3d658633f5e6e60579e1515e01967
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          envFrom:
            - secretRef: {name: yandex-oauth}
          env:
            - {name: YA_AUTH_BASE_URL, value: 'https://app.example.com/yandex_auth'}
            - {name: YA_AUTH_COOKIE_DOMAIN, value: app.example.com}
            - {name: YA_AUTH_ALLOWED_RETURN_HOSTS, value: app.example.com}
            - {name: YA_AUTH_DEFAULT_REDIRECT_URL, value: 'https://app.example.com/private'}
            - {name: YA_AUTH_ALLOWED_EMAIL_DOMAINS, value: example.com}
            - {name: YA_AUTH_SESSION_TTL, value: 30m}
---
apiVersion: v1
kind: Service
metadata:
  name: yandex-forward-auth
spec:
  selector: {app: yandex-forward-auth}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: private-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: private-demo}
  template:
    metadata:
      labels: {app: private-demo}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.36.1
          command: [sh, -ec]
          args:
            - mkdir -p /tmp/www && echo authenticated > /tmp/www/private && exec httpd -f -p 8080 -h /tmp/www
---
apiVersion: v1
kind: Service
metadata:
  name: private-demo
spec:
  selector: {app: private-demo}
  ports:
    - {name: http, port: 80, targetPort: 8080}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth
spec:
  stripPrefix:
    prefixes: [/yandex_auth]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: verify
spec:
  forwardAuth:
    address: http://yandex-forward-auth.auth-demo.svc:3000/auth
    preserveLocationHeader: true
    trustForwardHeader: false
    authRequestHeaders: [Cookie]
    authResponseHeaders: [X-Auth-User, X-Auth-Login, X-Auth-Email, X-Auth-Session-ID]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-endpoints
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: auth-demo-strip-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.example.com]
      secretName: app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /yandex_auth
            pathType: Prefix
            backend:
              service: {name: yandex-forward-auth, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: private-demo
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: auth-demo-verify@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.example.com]
      secretName: app-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /private
            pathType: Exact
            backend:
              service: {name: private-demo, port: {name: http}}
